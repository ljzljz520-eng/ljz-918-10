# 无人售货机守护面板 - nginx + php-fpm 示例配置（本机/内网）
server {
    listen 8080;
    server_name _;
    root /opt/vm-panel/www;
    index login.php;

    # 仅允许本机与内网访问
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    allow 172.16.0.0/12;
    deny all;

    # 隐藏敏感路径
    location ~ ^/lib/ { deny all; return 403; }
    location ~ /\. { deny all; }
    location ~* \.(log|pid|sh|sql|md)$ { deny all; }

    location / { try_files $uri $uri/ /login.php; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock; # 按实际 fpm 监听调整
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(css|js|png|svg|ico)$ { expires 1h; add_header Cache-Control "public"; }
}
