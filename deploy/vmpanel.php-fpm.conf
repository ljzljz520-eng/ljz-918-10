; 部署要点（Debian/Ubuntu）:
; 1) apt install php-cli php-fpm   （面板仅需核心扩展，无第三方依赖）
; 2) 将项目放到 /opt/vm-panel，确保 php-fpm 运行用户（如 www-data）：
;      - 对 bin/vmctl、services/*.sh 有执行权限
;      - 对 var/run、var/logs、var/audit 有写权限
;    执行：sudo ./setup.sh www-data
; 3) shell_exec 不能出现在 php.ini 的 disable_functions 中
; 4) 生产环境务必：
;      - 登录后立即修改默认密码 admin/admin123
;      - 仅绑定内网/回环地址，或经由 VPN 访问
;      - 如需公网访问，请在前面加 TLS 反向代理
